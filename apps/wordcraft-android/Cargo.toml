[package]
name = "wordcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft for Android (eframe NativeActivity shell around the same WordApp as desktop and web)"

# No `[lints] workspace = true` here on purpose: the workspace forbids `unsafe`, and the Android
# entry point (`#[unsafe(no_mangle)] android_main`) needs it.

[lib]
name = "wordcraft_android"
crate-type = ["cdylib"]

# Everything is Android-only, so `cargo build --workspace` on a desktop stays unaffected.
[target.'cfg(target_os = "android")'.dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
log = { workspace = true }
serde_json = { workspace = true }
jni = "0.21"
android_logger = "0.14"

[package.metadata.android]
package = "org.wordcraft.android"
apk_name = "WordCraft"
icon = "icon.png"
window_soft_input_mode = "stateAlwaysHidden"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "WordCraft"

# Android 11+: lets the built-in file browser see Documents/Downloads once the user switches on
# "Allow access to all files" for the app (Settings > Apps > WordCraft > Permissions).
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# Android 10 and older.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29
