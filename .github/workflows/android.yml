name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK platform and build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-30" "platforms;android-34" "build-tools;34.0.0"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/wordcraft.keystore"

      - name: Build the APK
        working-directory: apps/wordcraft-android
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/wordcraft.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CARGO_APK_RELEASE_KEY_ALIAS: wordcraft
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release

      - name: Collect the APK
        run: |
          APK=$(find target -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" "WordCraft-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WordCraft-build-${{ github.run_number }}
          path: WordCraft-build-${{ github.run_number }}.apk

      - name: Publish as a release (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: WordCraft Android build ${{ github.run_number }}
          prerelease: true
          files: WordCraft-build-${{ github.run_number }}.apk
